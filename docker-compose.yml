services:

  postgres:
    image: postgres:16
    container_name: tripplanner-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tripplanner
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - tripplanner-network


  pgadmin:
    image: dpage/pgadmin4
    container_name: tripplanner-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tripplanner.com
      PGADMIN_DEFAULT_PASSWORD: admin_password

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      - postgres

    networks:
      - tripplanner-network


volumes:
  postgres_data:
  pgadmin_data:


networks:
  tripplanner-network:
    driver: bridge